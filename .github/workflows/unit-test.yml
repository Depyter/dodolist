name: Unit Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/dodolist/package.json

      - name: Install dependencies
        working-directory: frontend/dodolist
        run: npm ci

      - name: Run unit tests
        working-directory: frontend/dodolist
        run: npm test

      - name: Generate coverage report
        working-directory: frontend/dodolist
        run: npm test -- --coverage

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: frontend/dodolist/coverage/
          retention-days: 7
