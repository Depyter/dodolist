services:
  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    ports:
      - "0.0.0.0:8080:8080"
    volumes:
      - pb_data:/pb/pb_data
      - ./backend/pb_migrations:/pb/pb_migrations
      - ./backend/pb_hooks:/pb/pb_hooks
      - ./backend/migrations:/pb/migrations
    restart: unless-stopped
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8080/api/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dodolist-network

  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend/dodolist:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://backend:8080
      - CORS_ALLOWED_ORIGINS=*
    depends_on:
      - backend
    networks:
      - dodolist-network

networks:
  dodolist-network:
    driver: bridge

volumes:
  pb_data:
    driver: local
