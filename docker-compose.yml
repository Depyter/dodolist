services:
  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    volumes:
      - pb_data:/pb/pb_data
      - ./backend/pb_migrations:/pb/pb_migrations
      - ./backend/pb_hooks:/pb/pb_hooks
    restart: unless-stopped
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8080/api/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dodolist-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - dodolist-network

networks:
  dodolist-network:
    driver: bridge

volumes:
  pb_data:
    driver: local
